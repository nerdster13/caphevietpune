<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cà Phê VIET - Authentic Vietnamese Coffee House in Pune</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --terracotta: #C17857;
            --terracotta-dark: #A05C3F;
            --sage: #7B9B8F;
            --cream: #F5F1E8;
            --warm-white: #FFF9F0;
            --coffee: #3D2817;
            --maroon: #6B2C3E;
        }

        body {
            font-family: 'Crimson Text', serif;
            color: var(--coffee);
            background: var(--warm-white);
            overflow-x: hidden;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(245, 241, 232, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 1.2rem 5%;
            border-bottom: 1px solid rgba(193, 120, 87, 0.2);
        }

        nav .container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .logo {
            display: flex;
            align-items: center;
            gap: 0;
        }

        nav .logo img {
            height: 60px;
            width: auto;
            transition: transform 0.3s;
        }

        nav .logo img:hover {
            transform: scale(1.05);
        }

        nav .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        nav a {
            text-decoration: none;
            color: var(--coffee);
            font-size: 1.1rem;
            transition: color 0.3s;
            position: relative;
        }

        nav a:hover {
            color: var(--terracotta);
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--terracotta);
            transition: width 0.3s;
        }

        nav a:hover::after {
            width: 100%;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: linear-gradient(135deg, var(--cream) 0%, var(--warm-white) 100%);
            
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grain" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="%23F5F1E8"/><g opacity="0.03"><circle cx="10" cy="10" r="1" fill="%233D2817"/><circle cx="50" cy="30" r="1" fill="%233D2817"/><circle cx="80" cy="70" r="1" fill="%233D2817"/><circle cx="30" cy="90" r="1" fill="%233D2817"/></g></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            opacity: 0.5;
            pointer-events: none;
        }

        .hero-content {
            text-align: center;
            z-index: 1;
            max-width: 900px;
            padding: 2rem;
            animation: fadeInUp 1.2s ease-out;
        }

        .hero-tagline {
            font-family: 'Crimson Text', serif;
            font-size: 1.4rem;
            font-style: italic;
            color: var(--terracotta);
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.3s forwards;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 5.5rem;
            font-weight: 700;
            color: var(--maroon);
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: 0.02em;
        }

        .hero-subtitle {
            font-size: 1.6rem;
            color: var(--coffee);
            margin-bottom: 2.5rem;
            line-height: 1.6;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.6s forwards;
        }

        .hero-cta {
            display: inline-block;
            padding: 1rem 3rem;
            background: var(--terracotta);
            color: var(--warm-white);
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(193, 120, 87, 0.3);
            opacity: 0;
            animation: fadeIn 1s ease-out 0.9s forwards;
        }

        .hero-cta:hover {
            background: var(--terracotta-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(193, 120, 87, 0.4);
        }

        .hero-scroll {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            color: var(--coffee);
            opacity: 0.6;
            animation: bounce 2s infinite;
        }

        /* Section Styling */
        section {
            padding: 6rem 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .section-label {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--terracotta);
            margin-bottom: 0.5rem;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--maroon);
            margin-bottom: 1rem;
        }

        .section-description {
            font-size: 1.3rem;
            color: var(--coffee);
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.7;
            opacity: 0.9;
        }

        /* About Section */
        .about {
            background: var(--cream);
            position: relative;
        }

        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .about-text {
            font-size: 1.25rem;
            line-height: 1.9;
            color: var(--coffee);
        }

        .about-text p {
            margin-bottom: 1.5rem;
        }

        .about-highlight {
            background: var(--warm-white);
            padding: 2rem;
            border-left: 4px solid var(--terracotta);
            margin: 2rem 0;
            font-style: italic;
        }

        .about-image {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .about-image img {
            width: 100%;
            height: 500px;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .about-image:hover img {
            transform: scale(1.05);
        }

        /* Menu Section */
        .menu {
            background: var(--warm-white);
        }

        .menu-categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 3rem;
            margin-top: 3rem;
        }

        .menu-category {
            background: var(--cream);
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s;
        }

        .menu-category:hover {
            transform: translateY(-5px);
        }

        .menu-category h3 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--maroon);
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--terracotta);
            padding-bottom: 0.5rem;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1.2rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px dashed rgba(61, 40, 23, 0.2);
        }

        .menu-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .menu-item-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--coffee);
        }

        .menu-item-desc {
            font-size: 1rem;
            color: var(--coffee);
            opacity: 0.7;
            font-style: italic;
            margin-top: 0.3rem;
        }

        .menu-item-price {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--terracotta);
            white-space: nowrap;
        }

        /* Gallery Section */
        .gallery {
            background: var(--cream);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 3rem;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            cursor: pointer;
            aspect-ratio: 1;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .gallery-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, transparent, rgba(61, 40, 23, 0.4));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .gallery-item:hover::after {
            opacity: 1;
        }

        /* Location Section */
        .location {
            background: var(--warm-white);
        }

        .location-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            margin-top: 3rem;
        }

        .location-info {
            background: var(--cream);
            padding: 3rem;
            border-radius: 8px;
        }

        .location-item {
            margin-bottom: 2.5rem;
        }

        .location-item:last-child {
            margin-bottom: 0;
        }

        .location-item h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--maroon);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .location-item p {
            font-size: 1.2rem;
            line-height: 1.7;
            color: var(--coffee);
        }

        .hours-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.8rem 1.5rem;
            margin-top: 1rem;
        }

        .day {
            font-weight: 600;
            color: var(--coffee);
        }

        .time {
            color: var(--coffee);
            opacity: 0.8;
        }

        .closed {
            color: var(--terracotta);
            font-style: italic;
        }

        .location-map {
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            height: 100%;
            min-height: 450px;
            background: var(--cream);
        }

        .location-map iframe {
            display: block;
        }

        /* Footer */
        footer {
            background: var(--coffee);
            color: var(--warm-white);
            padding: 3rem 5%;
            text-align: center;
        }

        footer p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        footer a {
            color: var(--terracotta);
            text-decoration: none;
            transition: color 0.3s;
        }

        footer a:hover {
            color: var(--warm-white);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        /* Responsive */
        @media (max-width: 968px) {
            nav .nav-links {
                gap: 1.5rem;
            }

            .hero h1 {
                font-size: 3.5rem;
            }

            .hero-subtitle {
                font-size: 1.3rem;
            }

            .section-title {
                font-size: 2.5rem;
            }

            .about-content,
            .location-content {
                grid-template-columns: 1fr;
                gap: 2rem;
            }

            .menu-categories {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            nav {
                padding: 1rem 5%;
            }

            nav .logo img {
                height: 45px;
            }

            nav .nav-links {
                display: none;
            }

            .hero h1 {
                font-size: 2.5rem;
            }

            .hero-subtitle {
                font-size: 1.1rem;
            }

            section {
                padding: 4rem 5%;
            }

            .section-title {
                font-size: 2rem;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollToSection = (id) => {
                const element = document.getElementById(id);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth' });
                }
            };

            return (
                <>
                    <nav style={{ boxShadow: scrolled ? '0 4px 20px rgba(0,0,0,0.1)' : 'none' }}>
                        <div className="container">
                            <a href="#" className="logo" onClick={(e) => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); }}>
                                <img src="logo.png" alt="Cà Phê VIET Logo" />
                            </a>
                            <ul className="nav-links">
                                <li><a href="#about" onClick={(e) => { e.preventDefault(); scrollToSection('about'); }}>About</a></li>
                                <li><a href="#menu" onClick={(e) => { e.preventDefault(); scrollToSection('menu'); }}>Menu</a></li>
                                <li><a href="#gallery" onClick={(e) => { e.preventDefault(); scrollToSection('gallery'); }}>Gallery</a></li>
                                <li><a href="#location" onClick={(e) => { e.preventDefault(); scrollToSection('location'); }}>Visit Us</a></li>
                            </ul>
                        </div>
                    </nav>

                    <section className="hero">
                        <div className="hero-content">
                            <div className="hero-tagline">From Vietnam With Love</div>
                            <h1>Cà Phê VIET</h1>
                            <p className="hero-subtitle">
                                Pune's pioneering authentic Vietnamese specialty coffee house, bringing you the rich flavors and time-honored traditions of Vietnamese coffee culture
                            </p>
                            <a href="#menu" className="hero-cta" onClick={(e) => { e.preventDefault(); scrollToSection('menu'); }}>
                                Explore Our Menu
                            </a>
                        </div>
                        <div className="hero-scroll">↓ Scroll to discover</div>
                    </section>

                    <section id="about" className="about">
                        <div className="section-header">
                            <div className="section-label">Our Story</div>
                            <h2 className="section-title">A Vietnamese Coffee Journey</h2>
                        </div>
                        <div className="about-content">
                            <div className="about-text">
                                <p>
                                    Cà Phê VIET stands as the pioneering authentic Vietnamese specialty coffee house in Pune. We offer an exquisite selection of Vietnamese manual brews, renowned for their rich flavors and unique preparation methods.
                                </p>
                                <div className="about-highlight">
                                    "Each cup is crafted with love, honoring centuries-old Vietnamese coffee traditions while creating a warm, welcoming space for our community."
                                </div>
                                <p>
                                    From our signature Vietnamese drip coffee to specialty preparations like egg cream coffee and salted cream coffee, we bring authentic Vietnamese coffee culture to Pune. Our cozy space invites you to slow down, savor the moment, and experience coffee the Vietnamese way.
                                </p>
                            </div>
                            <div className="about-image">
                                <img src="cafe6.webp" alt="From Vietnam With Love window" />
                            </div>
                        </div>
                    </section>

                    <section id="menu" className="menu">
                        <div className="section-header">
                            <div className="section-label">Our Offerings</div>
                            <h2 className="section-title">Coffee & More</h2>
                            <p className="section-description">
                                Authentic Vietnamese coffee traditions, from classic Viet Black to our specialty egg cream and coconut preparations
                            </p>
                        </div>
                        <div className="menu-categories">
                            <div className="menu-category">
                                <h3>Specialty Viet Cà Phê</h3>
                                <div className="menu-item">
                                    <div>
                                        <div className="menu-item-name">Egg Cream Coffee</div>
                                        <div className="menu-item-desc">Iced / Hot • Incl. Cinnamon</div>
                                    </div>
                                    <div className="menu-item-price">₹220</div>
                                </div>
                                <div className="menu-item">
                                    <div>
                                        <div className="menu-item-name">Iced Coconut Coffee</div>
                                        <div className="menu-item-desc">Refreshing coconut blend</div>
                                    </div>
                                    <div className="menu-item-price">₹210</div>
                                </div>
                                <div className="menu-item">
                                    <div>
                                        <div className="menu-item-name">Iced Salted Cream Coffee</div>
                                        <div className="menu-item-desc">Sweet and salty perfection</div>
                                    </div>
                                    <div className="menu-item-price">₹210</div>
                                </div>
                            </div>

                            <div className="menu-category">
                                <h3>Classics</h3>
                                <div className="menu-item">
                                    <div>
                                        <div className="menu-item-name">Viet Black</div>
                                    </div>
                                    <div>
                                        <span className="menu-item-price">Hot ₹180</span>
                                        <span className="menu-item-price" style={{marginLeft: '1rem'}}>Iced ₹190</span>
                                    </div>

                                    <div>

                                    </div>
                                    <div className="menu-item-price">₹20</div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section id="gallery" className="gallery">
                        <div className="section-header">
                            <div className="section-label">Our Space</div>
                            <h2 className="section-title">Experience Cà Phê VIET</h2>
                        </div>
                        <div className="gallery-grid">
                            <div className="gallery-item">
                                <img src="cafe_viet.webp" alt="Cafe exterior" />
                            </div>
                            <div className="gallery-item">
                                <img src="cafe2.webp" alt="Cozy interior with vintage posters" />

                    </section>

                    <section id="location" className="location">
                        <div className="section-header">
                            <div className="section-label">Visit Us</div>
                            <h2 className="section-title">Find Your Way Here</h2>
                        </div>
                        <div className="location-content">
                            <div className="location-info">
                                <div className="location-item">
                                    <h3>📍 Address</h3>
                                    <p>
                                        Shop no 13, Madhuban A, Samarth Rd<br />

                                        Ganesh Nagar, Karvenagar<br />
                                        Pune, Maharashtra 411052, India
                                    </p>
                                </div>

                                <div className="location-item">
                                    <h3>🕐 Hours</h3>
                                    <div className="hours-grid">
                                        <span className="day">Monday</span>
                                        <span className="time closed">Closed</span>
                                        
                                        <span className="day">Tuesday - Sunday</span>
                                        <span className="time">10 AM - 2 PM, 4 PM - 9 PM</span>
                                    </div>
                                </div>

                                <div className="location-item">
                                    <h3>📞 Contact</h3>
                                    <p>
                                        For reservations and inquiries,<br />
                                        please visit us during business hours
                                    </p>
                                </div>
                            </div>
                            <div className="location-map">
                                <iframe 
                                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3783.781714285218!2d73.8256808!3d18.4935442!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc2bf0062255fd3%3A0x41af7d4955a42600!2sC%C3%A0%20PH%C3%8A%20VIET%20(Vietnamese%20coffee%20house)!5e0!3m2!1sen!2sus!4v1769730037314!5m2!1sen!2sus"
                                    width="100%" 
                                    height="100%" 
                                    style={{ border: 0, borderRadius: '8px' }}
                                    allowFullScreen="" 
                                    loading="lazy" 
                                    referrerPolicy="no-referrer-when-downgrade"
                                    title="Cà Phê VIET Location"

                            </div>

                    </section>
